# Spins up a local PostgreSQL 16 database for the project.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: olist_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - ./:/project
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
